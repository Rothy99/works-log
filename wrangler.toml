# wrangler.toml
# Configures the Cloudflare Worker with Assets deployment for Works Log.

name = "works-log"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "works-log-db"
database_id = "INSERT_YOUR_DATABASE_ID_HERE"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "works-log-photos"
