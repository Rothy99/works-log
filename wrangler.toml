# wrangler.toml
# Configures the Cloudflare Worker with Assets deployment for Works Log.

name = "works-log"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "daily-work-manager"
database_id = "78a941df-9bb6-46be-b7f2-66ee7bd938fb"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "works-log-photos"
